name: Nix

on:
  pull_request:
  push:
    branches: [master]

# Match the custom APK's supported device architecture.
env:
  BUILD_ABI: arm64-v8a

jobs:
  develop:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v17
        with:
          name: fcitx5-android
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Prepare pinned custom Rime sources and offline data
        run: nix develop .#noAS --command python3 scripts/prepare_personal_rime.py
      - name: Build the custom Rime library in the Nix environment
        run: nix develop .#noAS --command bash scripts/build_personal_rime.sh "$BUILD_ABI"
      - name: Build Release APK and plugins
        run: nix develop .#noAS --command ./gradlew -PpersonalPackaging=lite :app:assembleRelease :assembleReleasePlugins --stacktrace
      - name: Verify bundled offline data in the Nix APK
        run: |
          nix develop .#noAS --command python3 - <<'PYTHON'
          from pathlib import Path
          from scripts.verify_personal_apk import verify_assets
          apks = list(Path('app/build/outputs/apk/release').glob('*.apk'))
          assert len(apks) == 1, apks
          verify_assets(apks[0], 'arm64-v8a')
          print('Nix-built lite APK contains Rime, all offline models and Japanese data')
          PYTHON
