name: IME latency and speech diagnostics
on:
  push:
    branches: ['fix/ime-latency-*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ime-diagnostics-${{ github.ref }}
  cancel-in-progress: true
env:
  MAIN_APPLICATION_ID: org.fcitx.fcitx5.android.bw1145
jobs:
  android-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
      - name: Preserve identical benchmark source and candidate commit
        run: |
          mkdir -p "$RUNNER_TEMP/ime-harness" "$RUNNER_TEMP/ime-apks/baseline" "$RUNNER_TEMP/ime-apks/candidate"
          cp app/src/androidTest/java/org/fcitx/fcitx5/android/{PersonalInputLatencyTest,ArtKeyboardFrameTest}.kt "$RUNNER_TEMP/ime-harness/"
          git rev-parse HEAD > "$RUNNER_TEMP/ime-apks/candidate-commit.txt"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - name: Install exact existing project toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y extra-cmake-modules gettext
          sdkmanager 'platforms;android-36' 'build-tools;36.1.0' 'ndk;28.0.13004108' 'cmake;3.31.6'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 633e16418c72f0ee7ea46464c64fc177e7056059
          submodules: recursive
      - name: Build frozen baseline with identical measurement harness
        run: |
          cp "$RUNNER_TEMP/ime-harness/"*.kt app/src/androidTest/java/org/fcitx/fcitx5/android/
          python3 scripts/prepare_personal_rime.py
          bash scripts/build_personal_rime.sh x86_64
          ./gradlew --stacktrace -PbuildABI=x86_64 -PpersonalPackaging=lite :app:assembleDebug :app:assembleDebugAndroidTest
          cp "$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)" "$RUNNER_TEMP/ime-apks/baseline/app.apk"
          cp "$(find app/build/outputs/apk/androidTest/debug -name '*.apk' -print -quit)" "$RUNNER_TEMP/ime-apks/baseline/tests.apk"
          git rev-parse HEAD > "$RUNNER_TEMP/ime-apks/baseline-commit.txt"
          mkdir -p "$RUNNER_TEMP/ime-apks/baseline-source-locks"
          cp LICENSE scripts/personal-rime-dependencies.json "$RUNNER_TEMP/ime-apks/baseline-source-locks/"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          submodules: recursive
      - name: Build candidate and run host unit/native checks
        run: |
          for test in PersonalInputLatencyTest ArtKeyboardFrameTest; do
            cmp "$RUNNER_TEMP/ime-harness/$test.kt" "app/src/androidTest/java/org/fcitx/fcitx5/android/$test.kt"
          done
          python3 scripts/prepare_personal_rime.py
          python3 -m unittest discover -s scripts -p 'test_ime_*.py' -v
          bash scripts/run_native_candidate_checks.sh
          python3 scripts/test_rime_personal_context.py
          bash scripts/run_candidate_budget_contract.sh
          bash scripts/check_candidate_frontend_syntax.sh
          bash scripts/budget_benchmark.sh
          git fetch --depth=1 origin 6bfc3b5bb68d92a353bcc6fc9bf009a277e6d52a
          bash scripts/run_candidate_benchmark.sh
          bash scripts/build_personal_rime.sh x86_64
          ./gradlew --stacktrace -PbuildABI=x86_64 -PpersonalPackaging=lite :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
          cp "$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)" "$RUNNER_TEMP/ime-apks/candidate/app.apk"
          cp "$(find app/build/outputs/apk/androidTest/debug -name '*.apk' -print -quit)" "$RUNNER_TEMP/ime-apks/candidate/tests.apk"
      - name: Enable KVM and verify hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: A/B real Android engine and fake-service Binder contract
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          disable-linux-hw-accel: false
          script: bash scripts/run_ime_diagnostics.sh "$RUNNER_TEMP/ime-apks"
      - name: Record immutable inputs and APK checksums
        if: always()
        run: |
          mkdir -p build/ime-diagnostics
          cp "$RUNNER_TEMP/ime-apks/"*-commit.txt build/ime-diagnostics/ || true
          python3 scripts/record_ime_provenance.py "$RUNNER_TEMP/ime-apks"
          find "$RUNNER_TEMP/ime-apks" -name '*.apk' -exec sha256sum {} \; > build/ime-diagnostics/apk-sha256.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: ime-diagnostics-${{ github.sha }}
          path: |
            build/ime-diagnostics/
            build/candidate-benchmark/*.txt
            build/candidate-benchmark/*-samples.csv
            build/personal-ci/*.txt
            build/candidate-budget-contract/*.txt
            build/budget-benchmark/*.csv
            build/budget-benchmark/*.txt
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: error
      - name: Upload actual diagnostic APK bytes and provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: ime-diagnostic-apks-${{ github.sha }}
          path: ${{ runner.temp }}/ime-apks/
          retention-days: 7
          if-no-files-found: error
