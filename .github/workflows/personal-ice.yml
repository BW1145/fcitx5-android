name: Personal Custom APK

on:
  push:
    branches: [personal-ice]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-ice-${{ github.ref }}
  cancel-in-progress: true

env:
  MAIN_APPLICATION_ID: org.fcitx.fcitx5.android.bw1145

jobs:
  version:
    if: github.repository == 'BW1145/fcitx5-android'
    runs-on: ubuntu-24.04
    outputs:
      name: ${{ steps.version.outputs.name }}
      code: ${{ steps.version.outputs.code }}
      timestamp: ${{ steps.version.outputs.timestamp }}
    steps:
      - id: version
        name: Choose one version for all delivered APKs
        run: |
          echo "name=1.3.6" >> "$GITHUB_OUTPUT"
          echo "code=$((3000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"
          echo "timestamp=$(date +%s000)" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ubuntu-24.04
    env:
      BUILD_VERSION_NAME: ${{ needs.version.outputs.name }}
      BUILD_VERSION_CODE: ${{ needs.version.outputs.code }}
      BUILD_TIMESTAMP: ${{ needs.version.outputs.timestamp }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y extra-cmake-modules gettext
          sdkmanager 'platforms;android-36' 'build-tools;36.1.0' 'ndk;28.0.13004108' 'cmake;3.31.6'
      - name: Prepare pinned Rime and offline model data
        run: python3 scripts/prepare_personal_rime.py
      - uses: gradle/actions/setup-gradle@v6
      - name: Build Rime 1.17 with input enhancements
        run: bash scripts/build_personal_rime.sh arm64-v8a
      - name: Build the signed reference IME and optional plugins
        env:
          SIGN_KEY_BASE64: ${{ secrets.PERSONAL_SIGNING_KEY }}
          SIGN_KEY_PWD: ${{ secrets.PERSONAL_SIGNING_PASSWORD }}
          SIGN_KEY_ALIAS: personal
        run: |
          ./gradlew -PbuildABI=arm64-v8a -PpersonalPackaging=full :app:assembleRelease :plugin:chewing:assembleRelease :plugin:clipboard-filter:assembleRelease
      - name: Verify final versions, plugin manifests and the existing signing identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist build/personal-ci "$RUNNER_TEMP/previous-signature"
          apk=$(find app/build/outputs/apk/release -name '*.apk' -print -quit)
          chewing=$(find plugin/chewing/build/outputs/apk/release -name '*.apk' -print -quit)
          clipboard=$(find plugin/clipboard-filter/build/outputs/apk/release -name '*.apk' -print -quit)
          gh release download custom-1.1.24 --repo "$GITHUB_REPOSITORY" --pattern signature.txt --dir "$RUNNER_TEMP/previous-signature"
          python3 scripts/verify_personal_apk.py "$apk" arm64-v8a \
            --application-id "$MAIN_APPLICATION_ID" \
            --version-code "$BUILD_VERSION_CODE" --version-name "$BUILD_VERSION_NAME" \
            --plugin-apk "$chewing" --plugin-apk "$clipboard" \
            --previous-signature "$RUNNER_TEMP/previous-signature/signature.txt" \
            --signature-report build/personal-ci/reference-signature.txt
          cp "$apk" build/personal-ci/reference-full.apk
          cp "$chewing" dist/fcitx5-custom-chewing-arm64.apk
          cp "$clipboard" dist/fcitx5-custom-clipboard-filter.apk
          cp scripts/personal-rime-dependencies.json dist/
      - name: Build the signed lightweight release APK
        env:
          SIGN_KEY_BASE64: ${{ secrets.PERSONAL_SIGNING_KEY }}
          SIGN_KEY_PWD: ${{ secrets.PERSONAL_SIGNING_PASSWORD }}
          SIGN_KEY_ALIAS: personal
        run: ./gradlew -PbuildABI=arm64-v8a -PpersonalPackaging=lite :app:assembleRelease
      - name: Verify the release identity, retained data and measured size reduction
        run: |
          apk=$(find app/build/outputs/apk/release -name '*.apk' -print -quit)
          python3 scripts/verify_personal_apk.py "$apk" arm64-v8a \
            --application-id "$MAIN_APPLICATION_ID" \
            --version-code "$BUILD_VERSION_CODE" --version-name "$BUILD_VERSION_NAME" \
            --previous-signature build/personal-ci/reference-signature.txt \
            --signature-report dist/signature.txt
          cp "$apk" dist/fcitx5-custom-arm64.apk
          "$ANDROID_HOME/build-tools/36.1.0/aapt" dump permissions "$apk" > dist/permissions.txt
          cp app/build/outputs/apk/release/build-metadata.json dist/
          python3 scripts/verify_personal_lite.py build/personal-ci/reference-full.apk \
            dist/fcitx5-custom-arm64.apk --report dist/apk-size-comparison.json
          cd dist
          sha256sum *.apk > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: arm64-apk
          path: dist/
          if-no-files-found: error

  smoke:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        packaging: [full, lite]
    runs-on: ubuntu-24.04
    env:
      BUILD_VERSION_NAME: ${{ needs.version.outputs.name }}
      BUILD_VERSION_CODE: ${{ needs.version.outputs.code }}
      BUILD_TIMESTAMP: ${{ needs.version.outputs.timestamp }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y extra-cmake-modules gettext
          sdkmanager 'platforms;android-36' 'build-tools;36.1.0' 'ndk;28.0.13004108' 'cmake;3.31.6'
      - name: Prepare pinned Rime and offline model data
        run: python3 scripts/prepare_personal_rime.py
      - uses: gradle/actions/setup-gradle@v6
      - name: Check native candidate rules, ordering and cache
        id: candidate_cache
        continue-on-error: true
        run: bash scripts/run_native_candidate_checks.sh
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build Rime for emulator
        run: bash scripts/build_personal_rime.sh x86_64
      - name: Build emulator IME, tests and matching plugins
        id: emulator_build
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p build/personal-ci
          ./gradlew --continue --stacktrace -PbuildABI=x86_64 -PpersonalPackaging=${{ matrix.packaging }} :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :plugin:chewing:assembleDebug :plugin:clipboard-filter:assembleDebug 2>&1 | tee build/personal-ci/emulator-build.log
      - name: Verify the debug plugin identities and signatures
        run: |
          apk=$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)
          chewing=$(find plugin/chewing/build/outputs/apk/debug -name '*.apk' -print -quit)
          clipboard=$(find plugin/clipboard-filter/build/outputs/apk/debug -name '*.apk' -print -quit)
          python3 scripts/verify_personal_apk.py "$apk" x86_64 \
            --application-id "$MAIN_APPLICATION_ID.debug" \
            --version-code "$BUILD_VERSION_CODE" --version-name "$BUILD_VERSION_NAME" \
            --plugin-apk "$chewing" --plugin-apk "$clipboard"
      - name: Test input, content search, data safety and plugin IPC on API 35
        id: emulator_tests
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/run_personal_smoke.sh full
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rime-runtime-test-results-${{ matrix.packaging }}
          path: |
            build/personal-ci/
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/reports/theme-previews/
            app/build/reports/maintenance/
      - name: Keep the verified APKs for Android 6 compatibility testing
        run: |
          mkdir -p test-apks
          cp "$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)" test-apks/app-debug.apk
          cp "$(find app/build/outputs/apk/androidTest/debug -name '*.apk' -print -quit)" test-apks/app-debug-androidTest.apk
      - uses: actions/upload-artifact@v7
        with:
          name: compatibility-test-apks-${{ matrix.packaging }}
          path: test-apks/
          if-no-files-found: error
      - name: Summarize build and runtime checks
        if: always()
        env:
          BUILD_RESULT: ${{ steps.emulator_build.outcome }}
          RUNTIME_RESULT: ${{ steps.emulator_tests.outcome }}
          CACHE_RESULT: ${{ steps.candidate_cache.outcome }}
        run: |
          {
            echo '### ${{ matrix.packaging }} checks'
            echo "- Build and unit tests: $BUILD_RESULT"
            echo "- Android 15 runtime tests: $RUNTIME_RESULT"
            echo "- Candidate cache: $CACHE_RESULT"
            echo '- Logs, unit test XML and runtime reports are in rime-runtime-test-results-${{ matrix.packaging }}.'
          } >> "$GITHUB_STEP_SUMMARY"
          [[ "$BUILD_RESULT" == success && "$RUNTIME_RESULT" == success && "$CACHE_RESULT" == success ]]

  compat:
    needs: [version, smoke]
    strategy:
      fail-fast: false
      matrix:
        packaging: [full, lite]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: actions/download-artifact@v8
        with:
          name: compatibility-test-apks-${{ matrix.packaging }}
          path: test-apks
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test search editing, tokenization, links and ZIP paths on API 23
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 23
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/run_personal_smoke.sh compat test-apks
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-6-compatibility-results-${{ matrix.packaging }}
          path: compatibility-results/

  upgrade:
    needs: smoke
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: actions/download-artifact@v8
        with:
          name: compatibility-test-apks-full
          path: test-apks/full
      - uses: actions/download-artifact@v8
        with:
          name: compatibility-test-apks-lite
          path: test-apks/lite
      - name: Download the verified 1.3.1 upgrade baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p test-apks/baseline
          gh release download custom-1.3.1 --repo "$GITHUB_REPOSITORY" --pattern upgrade-fixture-1.3.1-x86_64.zip --dir test-apks/baseline
          echo "442bfd99358b93efba67dca70fe148950aaaa4e2b350610cdda0ae65c7cb71bb  test-apks/baseline/upgrade-fixture-1.3.1-x86_64.zip" | sha256sum --check
          unzip -q test-apks/baseline/upgrade-fixture-1.3.1-x86_64.zip -d test-apks/baseline
      - name: Use the current upgrade tests against the baseline APK
        run: cp test-apks/full/app-debug-androidTest.apk test-apks/baseline/app-debug-androidTest.apk
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Use one signing identity for the independently built debug fixtures
        run: bash scripts/sign_upgrade_test_apks.sh test-apks/full test-apks/lite test-apks/baseline
      - name: Verify full to lite upgrade and full restoration preserve user data
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/run_personal_smoke.sh upgrade test-apks/full test-apks/lite test-apks/baseline
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: full-lite-upgrade-results
          path: upgrade-results/

  release:
    if: github.ref == 'refs/heads/personal-ice'
    needs: [version, build, smoke, compat, upgrade]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      BUILD_VERSION_NAME: ${{ needs.version.outputs.name }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: arm64-apk
          path: dist
      - name: Publish the verified personal APK and optional plugins
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          小企鹅输入法定制版，适用于 arm64 安卓设备，主包内置 Rime、雾凇全拼、离线模型及 Anthy 日语。

          本次更新：
          - 重做我的词库页面：文字与拼音搜索、读音和词长排序、长词及多读音筛选。
          - 相同文字集中展示，保留各读音与词典记录，可分别管理。
          - 长按多选，批量忘记、降低优先级或恢复候选；跨搜索保留选择，未完成项可重试。
          - 已调整候选单独浏览，可筛选已忘记和已降低优先级的记录。
          - 词条列表按需绘制，取消前 200 条限制，操作后保留浏览位置。
          - 保留原有学习、忘记、降权、恢复和历史备份行为，以及 1.3.5 的输入稳定性修复。

          安装：
          - 主安装包 fcitx5-custom-arm64.apk：采用轻量打包，保留雾凇全部词库、模型、联想、日语及全部定制功能。
          - 沿用既有包名与签名，可直接覆盖既有定制版并保留用户数据。
          - AI 仅在主动发送或测试时联网；API Key 在本机加密，换机后重新填写。系统语音服务可能联网。

          可选插件：
          - fcitx5-custom-chewing-arm64.apk：Chewing 注音插件。
          - fcitx5-custom-clipboard-filter.apk：剪贴板过滤器插件。

          发布检查覆盖签名与离线数据、协议与主题绘制、Android 15 输入及词库恢复、Android 6 兼容，以及 full/lite 覆盖切换的数据保留。
          EOF
          gh release create "custom-$BUILD_VERSION_NAME" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "小企鹅输入法定制版 $BUILD_VERSION_NAME" --notes-file notes.md

