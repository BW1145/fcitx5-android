name: Personal Custom APK

on:
  push:
    branches: [personal-ice]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-ice-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'BW1145/fcitx5-android'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y extra-cmake-modules gettext
          sdkmanager 'platforms;android-36' 'build-tools;36.1.0' 'ndk;28.0.13004108' 'cmake;3.31.6'
      - name: Prepare pinned Rime and offline model data
        run: |
          python3 scripts/prepare_personal_rime.py
      - uses: gradle/actions/setup-gradle@v6
      - name: Build Rime 1.17 with input enhancements
        run: bash scripts/build_personal_rime.sh arm64-v8a
      - name: Build signed arm64 APK
        env:
          SIGN_KEY_BASE64: ${{ secrets.PERSONAL_SIGNING_KEY }}
          SIGN_KEY_PWD: ${{ secrets.PERSONAL_SIGNING_PASSWORD }}
          SIGN_KEY_ALIAS: personal
        run: |
          ./gradlew -PbuildABI=arm64-v8a -PbuildVersionName=1.1.${{ github.run_number }} :app:assembleRelease
      - name: Verify installable APK and offline permissions
        run: |
          mkdir -p dist
          apk=$(find app/build/outputs/apk/release -name '*.apk' -print -quit)
          python3 scripts/verify_personal_apk.py "$apk" arm64-v8a
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --verbose --print-certs "$apk" > dist/signature.txt
          "$ANDROID_HOME/build-tools/36.1.0/aapt" dump permissions "$apk" > dist/permissions.txt
          if grep -q 'android.permission.INTERNET' dist/permissions.txt; then
            echo 'Unexpected internet permission'
            exit 1
          fi
          cp "$apk" dist/fcitx5-custom-arm64.apk
          cp app/build/outputs/apk/release/build-metadata.json dist/
          cp scripts/personal-rime-dependencies.json dist/
          cd dist
          sha256sum fcitx5-custom-arm64.apk > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: arm64-apk
          path: dist/

  smoke:
    if: github.repository == 'BW1145/fcitx5-android'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y extra-cmake-modules gettext
          sdkmanager 'platforms;android-36' 'build-tools;36.1.0' 'ndk;28.0.13004108' 'cmake;3.31.6'
      - name: Prepare pinned Rime and offline model data
        run: |
          python3 scripts/prepare_personal_rime.py
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build Rime for emulator
        run: bash scripts/build_personal_rime.sh x86_64
      - name: Build emulator test APKs
        run: ./gradlew -PbuildABI=x86_64 :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Test pinyin editing, Japanese, deletion and saved content
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/run_personal_smoke.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rime-runtime-test-results
          path: |
            app/build/reports/androidTests/connected/
            app/build/reports/androidTests/personal-native/
            app/build/outputs/androidTest-results/connected/

  release:
    if: github.repository == 'BW1145/fcitx5-android'
    needs: [build, smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: arm64-apk
          path: dist
      - name: Publish the personal APK in this fork
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          小企鹅输入法定制版，适用于 arm64 安卓设备，内置 Rime、雾凇全拼和 Anthy 日语。
          内置 Rime 1.17、多整句候选、约 41 MB 离线语言模型及 Predict 联想，默认启用拼写纠错和前后鼻音容错。
          雾凇选项提供模型增强和联想开关。
          支持剪贴板与常用内容搜索、拆词插入、本地链接清理、工具栏排列、按键文字与图标大小调整。
          三个点菜单中的「按键与宏」可编辑按键动作组合，预设长按删除键后上划清空。
          常用内容入口位于剪贴板旁边；光标控制位于三个点菜单。
          覆盖安装保留已有配置；升级后日语自动加入输入法列表，可通过语言切换键选择。
          安装包已通过签名、离线权限、词库完整性和安卓模拟器输入验证。
          对应源码和依赖版本记录在本发布标签中。
          EOF
          gh release create 'custom-1.1.${{ github.run_number }}' dist/* --repo '${{ github.repository }}' --target '${{ github.sha }}' --title '小企鹅输入法定制版 1.1.${{ github.run_number }}' --notes-file notes.md
